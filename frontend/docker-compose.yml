version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_WS_URL=${VITE_WS_URL:-}
    container_name: clickort-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - clickort-net

networks:
  clickort-net:
    name: clickort-net
    driver: bridge
