spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

topic:
  name: ${TOPIC_NAME:game_topic}

game:
  lobby:
    min-players: ${MIN_PLAYERS:2}
    max-nickname-length: 20
